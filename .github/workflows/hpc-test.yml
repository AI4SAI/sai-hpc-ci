name: sai-hpc-ci
on:
  workflow_call:
    inputs:
      source_repository: {required: true, type: string}
      source_sha: {required: true, type: string}
      cluster_profile: {required: true, type: string}
      tests_json: {required: true, type: string}
      remote_root: {required: true, type: string}
      ssh_port: {required: false, type: string, default: '22'}
      ssh_known_hosts: {required: true, type: string}
      secret_environment: {required: true, type: string}
    secrets:
      REMOTE_USER: {required: false}
      REMOTE_SSH_PRIVATE_KEY: {required: false}
permissions: {contents: read}
jobs:
  validate-and-submit:
    runs-on: ubuntu-latest
    environment: ${{ inputs.secret_environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AI4SAI/sai-hpc-ci
          # Keep this equal to the commit that contains this workflow.
          # A release update must change both the caller pin and this ref.
          ref: ed03867835c9f02892227ab0356dc5e41d94d468
          path: sai-hpc-ci
          persist-credentials: false
      - name: Validate request
        env:
          TESTS_JSON: '${{ inputs.tests_json }}'
          EXPECTED_REPOSITORY: '${{ inputs.source_repository }}'
          EXPECTED_SHA: '${{ inputs.source_sha }}'
          EXPECTED_PROFILE: '${{ inputs.cluster_profile }}'
          EXPECTED_REMOTE_ROOT: '${{ inputs.remote_root }}'
          EXPECTED_PORT: '${{ inputs.ssh_port }}'
          EXPECTED_KNOWN_HOSTS: '${{ inputs.ssh_known_hosts }}'
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REMOTE_ROOT" =~ ^~\/[A-Za-z0-9_./~-]+$ && "$EXPECTED_REMOTE_ROOT" != *..* ]] || { echo 'remote_root must be a safe path below ~/' >&2; exit 2; }
          [[ "$EXPECTED_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'invalid source_repository' >&2; exit 2; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'invalid source_sha' >&2; exit 2; }
          [[ "$EXPECTED_PROFILE" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo 'invalid cluster_profile' >&2; exit 2; }
          [[ "$EXPECTED_PORT" =~ ^[0-9]+$ && "$EXPECTED_PORT" -ge 1 && "$EXPECTED_PORT" -le 65535 ]] || { echo 'invalid ssh_port' >&2; exit 2; }
          test -n "$EXPECTED_KNOWN_HOSTS"
          printf '%s' "$TESTS_JSON" > plan.json
          python3 sai-hpc-ci/controller/validate_plan.py plan.json --output validated.json \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-profile "$EXPECTED_PROFILE"
      - name: Submit trusted remote array
        env:
          REMOTE_USER: '${{ secrets.REMOTE_USER }}'
          REMOTE_SSH_PRIVATE_KEY: '${{ secrets.REMOTE_SSH_PRIVATE_KEY }}'
          REMOTE_ROOT: '${{ inputs.remote_root }}'
          PROFILE: '${{ inputs.cluster_profile }}'
          SAI_HOST: '${{ vars.SAI_HOST }}'
          SAI_PORT: '${{ inputs.ssh_port }}'
          SAI_SSH_KNOWN_HOSTS: '${{ inputs.ssh_known_hosts }}'
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$REMOTE_SSH_PRIVATE_KEY" > key
          test -n "$SAI_SSH_KNOWN_HOSTS"
          printf '%s\n' "$SAI_SSH_KNOWN_HOSTS" > known_hosts
          ssh_opts=(-i key -p "$SAI_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts)
          remote_suffix="${REMOTE_ROOT#~/}"
          REMOTE_ROOT=$(ssh "${ssh_opts[@]}" "$REMOTE_USER@$SAI_HOST" "printf '%s/%s' \"\$HOME\" '$remote_suffix'")
          export REMOTE_ROOT
          mkdir -p bundle
          cp validated.json sai-hpc-ci/remote/run_array_task.py sai-hpc-ci/remote/task.sbatch sai-hpc-ci/remote/submit_array.sh sai-hpc-ci/remote/wait_jobs.sh bundle/
          cp "sai-hpc-ci/profiles/$PROFILE.env" bundle/profile.env
          ssh "${ssh_opts[@]}" "$REMOTE_USER@$SAI_HOST" "mkdir -p '$REMOTE_ROOT'"
          scp -q "${ssh_opts[@]}" -r bundle "$REMOTE_USER@$SAI_HOST:$REMOTE_ROOT/"
          mapfile -t jobs < <(ssh "${ssh_opts[@]}" "$REMOTE_USER@$SAI_HOST" \
            "cd '$REMOTE_ROOT/bundle' && PROFILE_FILE=profile.env PLAN_FILE=validated.json REMOTE_ROOT='$REMOTE_ROOT' CONTROLLER_ROOT='$REMOTE_ROOT/bundle' SLURM_SCRIPT=task.sbatch bash submit_array.sh" | grep -E '^[0-9]+(_[0-9]+)?$')
          ((${#jobs[@]} > 0))
          printf -v job_args ' %q' "${jobs[@]}"
          ssh "${ssh_opts[@]}" "$REMOTE_USER@$SAI_HOST" "bash '$REMOTE_ROOT/bundle/wait_jobs.sh'$job_args"
          mkdir -p results
          scp -q "${ssh_opts[@]}" -r "$REMOTE_USER@$SAI_HOST:$REMOTE_ROOT/results/." results/
          tar -czf sai-hpc-ci-results.tar.gz results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sai-hpc-ci-results
          path: sai-hpc-ci-results.tar.gz
          if-no-files-found: warn
